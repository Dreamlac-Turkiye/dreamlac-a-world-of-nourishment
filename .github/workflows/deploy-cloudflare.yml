name: Deploy independent Cloudflare Worker

# Deliberately manual: no production deployment on a PR or automatic merge.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreamlac-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun run check:environment && bun run check:commerce && bun run check:release
      - run: bun run build
        env:
          APP_ENV: production
          VITE_DATA_MODE: supabase
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          NITRO_PRESET: cloudflare-module
      # Runtime secrets must already exist on this Worker; never bundle them.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config .output/server/wrangler.json
